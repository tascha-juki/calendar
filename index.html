<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --accent-color: #4a90e2;
            --accent-dark: #357abd;
        }

        .theme-blue {
            background: #f4f8fd;
            --accent-color: #4a90e2;
            --accent-dark: #357abd;
        }
        .theme-green {
            background: #f2faf5;
            --accent-color: #6bbf8a;
            --accent-dark: #4ea372;
        }
        .theme-pink {
            background: #fdf2f7;
            --accent-color: #e88bb5;
            --accent-dark: #d16a9a;
        }
        .theme-yellow {
            background: #fdfbf0;
            --accent-color: #e8c76b;
            --accent-dark: #d1af4e;
        }

        .calendar-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 12px;
            padding: 7px;
            width: 190px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            user-select: none;
            color: #333;
            transition: background 0.3s ease;
            position: relative;
        }

        .calendar-container * {
            transition: background 0.2s ease, color 0.2s ease, border 0.2s ease;
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 11px;
            gap: 3px;
        }
        .calendar-header button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            font-weight: 300;
            padding: 0 2px;
            line-height: 1;
        }
        .calendar-header button:hover {
            color: #333;
        }
        .month-year {
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        .month-year:hover {
            background: rgba(0,0,0,0.06);
        }

        .picker {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 7px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            z-index: 10;
            display: none;
            width: 170px;
        }
        .picker.active { display: block; }
        .picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .picker-row button {
            background: #f5f5f5;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 7px;
            font-size: 11px;
            color: #555;
        }
        .picker-row button:hover { background: #e8e8e8; }
        .picker-months {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }
        .picker-months button {
            background: #f8f9fa;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 3px 0;
            font-size: 10px;
            color: #555;
            transition: background 0.2s ease;
        }
        .picker-months button:hover { background: #e8e8e8; }
        .picker-months button.active {
            background: var(--accent-color);
            color: white;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 9px;
            color: #999;
            margin-bottom: 2px;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 1px;
        }
        .day {
            padding: 3px 0;
            font-size: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border 0.2s ease;
            border: 1.5px solid transparent;
        }

        .day:hover {
            background: #ffffff;
        }
        .day.empty {
            cursor: default;
            color: transparent;
            border: none;
        }
        .day.empty:hover {
            background: transparent;
        }

        .day.today {
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            border: 1.5px solid var(--accent-color);
        }

        .day.selected {
            background: #ffffff;
            color: var(--accent-color);
            font-weight: bold;
            border: 1.5px solid var(--accent-color);
        }

        .theme-dots {
            margin-top: 5px;
            display: flex;
            gap: 3px;
            padding-left: 6px;
        }
        .theme-dots button {
            border: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .theme-dots button:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div class="calendar-container theme-blue" id="calendar">
    <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <span class="month-year" id="monthYear">Октябрь 2026</span>
        <button id="nextMonth">›</button>
    </div>
    <div class="picker" id="picker">
        <div class="picker-row">
            <button id="prevYear">− год</button>
            <span id="pickerYear">2026</span>
            <button id="nextYear">+ год</button>
        </div>
        <div class="picker-months" id="pickerMonths"></div>
    </div>
    <div class="weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="theme-dots">
        <button onclick="changeTheme('theme-blue', this)" style="background:#4a90e2;"></button>
        <button onclick="changeTheme('theme-green', this)" style="background:#6bbf8a;"></button>
        <button onclick="changeTheme('theme-pink', this)" style="background:#e88bb5;"></button>
        <button onclick="changeTheme('theme-yellow', this)" style="background:#e8c76b;"></button>
    </div>
</div>

<script>
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    const shortMonthNames = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];

    // Текущая отображаемая дата (месяц/год на экране)
    let viewDate = new Date();

    function renderCalendar() {
        // Всегда берём актуальную дату в момент отрисовки
        const now = new Date();
        const todayDay = now.getDate();
        const todayMonth = now.getMonth();
        const todayYear = now.getFullYear();

        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();

        document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;
        document.getElementById('pickerYear').textContent = year;

        const firstDay = new Date(year, month, 1).getDay();
        const startDay = (firstDay === 0) ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const daysGrid = document.getElementById('daysGrid');
        daysGrid.innerHTML = '';

        for (let i = 0; i < startDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day empty';
            daysGrid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            dayDiv.textContent = day;

            // Подсвечиваем "сегодня" только если отображается текущий месяц и год
            if (
                day === todayDay &&
                month === todayMonth &&
                year === todayYear
            ) {
                dayDiv.classList.add('today');
            }

            dayDiv.addEventListener('click', () => {
                document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
                dayDiv.classList.add('selected');
            });

            daysGrid.appendChild(dayDiv);
        }

        document.querySelectorAll('.picker-months button').forEach((btn, i) => {
            btn.classList.toggle('active', i === month);
        });
    }

    function buildMonthPicker() {
        const container = document.getElementById('pickerMonths');
        container.innerHTML = '';
        shortMonthNames.forEach((name, i) => {
            const btn = document.createElement('button');
            btn.textContent = name;
            btn.addEventListener('click', () => {
                viewDate.setMonth(i);
                renderCalendar();
                closePicker();
            });
            container.appendChild(btn);
        });
    }

    function closePicker() {
        document.getElementById('picker').classList.remove('active');
    }

    document.getElementById('monthYear').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('picker').classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#picker') && !e.target.closest('#monthYear')) {
            closePicker();
        }
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
        viewDate.setMonth(viewDate.getMonth() - 1);
        renderCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
        viewDate.setMonth(viewDate.getMonth() + 1);
        renderCalendar();
    });
    document.getElementById('prevYear').addEventListener('click', () => {
        viewDate.setFullYear(viewDate.getFullYear() - 1);
        renderCalendar();
    });
    document.getElementById('nextYear').addEventListener('click', () => {
        viewDate.setFullYear(viewDate.getFullYear() + 1);
        renderCalendar();
    });

    function changeTheme(themeClass, btn) {
        document.getElementById('calendar').className = 'calendar-container ' + themeClass;
    }

    buildMonthPicker();
    renderCalendar();
</script>
</body>
</html>
